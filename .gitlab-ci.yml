# GitLab CI/CD Pipeline for Django PostgreSQL Gunicorn Application

# Define pipeline stages
stages:
  - initialize
  - build
  - test
  - containerize
  - deployment
  - promote
  - notify

# Global variables
variables:
  PYTHON_VERSION: "3.12"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DOCKER_IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
  DOCKER_IMAGE_LATEST: "$CI_REGISTRY_IMAGE:latest"

# Cache configuration for Python dependencies
cache:
  paths:
    - .cache/pip
    - venv/

# Job template for Python setup
.python_setup:
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends gcc python3-dev default-libmysqlclient-dev gettext-base
    - python -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip

# ============================================
# INITIALIZE STAGE - Always runs
# ============================================
initialize:
  stage: initialize
  extends: .python_setup
  script:
    - pip install -r requirements.txt
    - echo "Dependencies installed successfully"
  artifacts:
    paths:
      - venv/
    expire_in: 1 hour
  rules:
    - when: always

# ============================================
# BUILD STAGE - Always runs
# ============================================
build:
  stage: build
  extends: .python_setup
  dependencies:
    - initialize
  script:
    - source venv/bin/activate
    - python manage.py collectstatic --noinput
    - echo "Build completed successfully"
  artifacts:
    paths:
      - static/
    expire_in: 1 hour
  rules:
    - when: always

# ============================================
# TEST STAGE - Always runs
# ============================================
test:
  stage: test
  extends: .python_setup
  dependencies:
    - initialize
  script:
    - source venv/bin/activate
    - python manage.py test
    - echo "Tests completed successfully"
  rules:
    - when: always

# ============================================
# CONTAINERIZE STAGE - Only on tags
# ============================================
containerize:
  stage: containerize
  image: docker:25-git
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $DOCKER_IMAGE -t $DOCKER_IMAGE_LATEST .
    - docker push $DOCKER_IMAGE
    - docker push $DOCKER_IMAGE_LATEST
    - echo "Docker image built and pushed successfully"
  rules:
    - if: '$CI_COMMIT_TAG'

# ============================================
# DEPLOYMENT STAGE - Deploy to staging (only on tags)
# ============================================
deploy_staging:
  stage: deployment
  image: alpine:latest
  dependencies:
    - containerize
  before_script:
    - apk add --no-cache curl
  script:
    - echo "Deploying to staging environment..."
    - echo "Image -> $DOCKER_IMAGE"
    # Add your deployment commands here
    # Example: kubectl set image deployment/myapp myapp=$DOCKER_IMAGE
    # Example: docker-compose -f docker-compose.staging.yml up -d
    - echo "Deployment to staging completed"
  environment:
    name: staging
    url: https://staging.example.com
  rules:
    - if: '$CI_COMMIT_TAG'

# ============================================
# PROMOTE STAGE - Manual promotion to production
# ============================================
promote_production:
  stage: promote
  image: docker:25-git
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Promoting image to production..."
    - docker pull $DOCKER_IMAGE
    - docker tag $DOCKER_IMAGE $CI_REGISTRY_IMAGE:production
    - docker push $CI_REGISTRY_IMAGE:production
    - echo "Image promoted to production successfully"
  environment:
    name: production
    url: https://production.example.com
  when: manual
  rules:
    - if: '$CI_COMMIT_TAG'

# ============================================
# NOTIFY STAGE - Always runs to notify build status
# ============================================
notify_success:
  stage: notify
  image: alpine:latest
  script:
    - echo "Pipeline succeeded for branch/tag $CI_COMMIT_REF_NAME"
    - echo "Commit -> $CI_COMMIT_SHORT_SHA"
    - echo "Author -> $CI_COMMIT_AUTHOR"
    # Add notification commands here
    # Example: curl -X POST -H 'Content-type: application/json' --data '{"text":"Build Success"}' $SLACK_WEBHOOK
  rules:
    - when: on_success

notify_failure:
  stage: notify
  image: alpine:latest
  script:
    - echo "Pipeline failed for branch/tag $CI_COMMIT_REF_NAME"
    - echo "Commit -> $CI_COMMIT_SHORT_SHA"
    - echo "Author -> $CI_COMMIT_AUTHOR"
    # Add notification commands here
    # Example: curl -X POST -H 'Content-type: application/json' --data '{"text":"Build Failed"}' $SLACK_WEBHOOK
  rules:
    - when: on_failure
